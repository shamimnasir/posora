    <path d="M282 329 C322 260 351 236 395 226"/><path d="M627 121 C704 77 778 91 817 132"/><path d="M811 202 C832 250 829 291 802 324"/><path d="M759 383 C655 496 440 497 316 396"/>
  </g>
  <g font-family="sans-serif" font-weight="700" font-size="25" fill="#17394a">
    <g><rect x="315" y="268" width="166" height="47" rx="23" fill="#fff"/><text x="398" y="300" text-anchor="middle">বাষ্পীভবন</text></g>
    <g><rect x="696" y="64" width="151" height="47" rx="23" fill="#fff"/><text x="771" y="96" text-anchor="middle">ঘনীভবন</text></g>
    <g><rect x="826" y="250" width="148" height="47" rx="23" fill="#fff"/><text x="900" y="282" text-anchor="middle">বৃষ্টিপাত</text></g>
    <g><rect x="500" y="464" width="177" height="47" rx="23" fill="#fff"/><text x="588" y="496" text-anchor="middle">প্রবাহ ও ফেরা</text></g>
